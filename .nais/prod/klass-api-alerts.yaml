apiVersion: "monitoring.coreos.com/v1"
kind: PrometheusRule
metadata:
  name: alert-klass-api
  namespace: dapla-metadata
  labels:
    team: dapla-metadata
spec:
  groups:
    - name: dapla-metadata
      rules:
        - alert: HTTP error responses
          expr: >-
            (100 * sum(rate(haproxy_backend_http_responses_total{proxy=~"dapla-metadata_klass.*", code!~"5xx"}[10m]))
            / sum(rate(haproxy_backend_http_responses_total{proxy=~"dapla-metadata_klass.*"}[10m])) < 75.0)
            and sum(rate(haproxy_backend_http_responses_total{proxy=~"dapla-metadata_klass.*"}[10m])) > 0
          for: 3m
          annotations:
            title: "HTTP error responses"
            consequence: "A high number of HTTP requests are receiving error responses. This may indicate a problem with the application."
            action: "Investigate whether this indicates an app failure or user errors."
          labels:
            service: klass-api
            namespace: dapla-metadata
            severity: critical
            environment: prod

        - alert: High heap memory usage
          expr: (100 * sum by (instance) (jvm_memory_used_bytes{application="klass", area="heap"})) / (sum by (instance) (jvm_memory_max_bytes{application="klass", area="heap"}) ) > 90.0
          for: 10m
          annotations:
            title: "High heap memory usage"
            consequence: "If this increase continues then the app could run out of memory and either lock or crash."
            action: "Immediate: Restart the app from the Nais console\nShort term: Investigate the cause of high heap usage and either fix the bug or increase the available heap."
          labels:
            service: klass-api
            namespace: dapla-metadata
            severity: critical
            environment: prod

        - alert: A Klass-api client is unavailable
          expr: rate(http_client_requests_seconds_count{application="klass", status!="200"}[1m]) > 0
          for: 1m
          annotations:
            title: "A Klass-api client is unavailable "
            consequence: "The service may lack some functionality"
            description: "Client {{ $labels.serviceId }} responded with {{ $labels.status }} causing {{ $labels.exception }}"
          labels:
            service: klass-api
            namespace: dapla-metadata
            severity: critical
            environment: prod

        - alert: GET operation timeouts
          expr: sum(rate(http_server_requests_seconds_count{application="klass", method="GET", outcome="TIMEOUT"}[5m])) > 0.1
          for: 2m
          annotations:
            title: "GET operation timeouts"
            consequence: "Multiple GET requests are timing out. Users may be experiencing failed or slow responses."
            action: "Check application logs for timeout details. Investigate slow queries, caching issues, or resource exhaustion."
          labels:
            service: klass-api
            namespace: dapla-metadata
            severity: critical
            environment: prod

        - alert: Klass is unavailable
          expr: kube_deployment_status_replicas_available{deployment="klass"} == 0
          for: 1m
          annotations:
            title: "Klass-api is unavailable"
            consequence: "Service is unavailable to users. "
          labels:
            service: klass-api
            namespace: dapla-metadata
            severity: critical
            environment: prod
